<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 896 896">
  <!-- DevDesigner logo: THE single source for the in-app logo, favicon and desktop icon.
       Swap this file, then run `node desktop/scripts/render-icon.mjs` to regenerate the PNGs.
       Draw it edge to edge (no outer padding); the desktop icon adds its own margin. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f8bff"/>
      <stop offset="1" stop-color="#3b5bdb"/>
    </linearGradient>
  </defs>
  <rect width="896" height="896" rx="200" fill="url(#bg)"/>
  <g transform="translate(112 112) scale(28)" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="7" height="7" rx="1.5"/>
    <rect x="13" y="13" width="7" height="7" rx="1.5"/>
    <path d="M11 7.5h4a2 2 0 0 1 2 2V13"/>
  </g>
</svg>
