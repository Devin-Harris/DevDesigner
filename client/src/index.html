<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DBDesigner</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <!-- UI type system: Space Grotesk (display/wordmark), IBM Plex Sans (UI),
         IBM Plex Mono (schema data). Icons are bespoke inline SVG (dbd-icon), so
         the Material Icons + Roboto fonts are no longer loaded. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Canvas text-element font families (hand-drawn / normal / code, Excalidraw-style). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Nunito:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="mat-typography">
    <app-root></app-root>
  </body>
</html>
