<!doctype html>
<html lang="en">
   <head>
      <meta charset="utf-8" />
      <title>DevDesigner</title>
      <base href="/" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <!-- Stop-gap CSP (security S4.1); the static host cannot send headers yet. Production
         builds also get a hash-based script-src CSP generated by Angular (security.autoCsp
         in angular.json), which covers the inline loaders the build adds. Connections,
         images, fonts and styles stay open (API host differs per deploy; data:/blob:
         images, Sentry). -->
      <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'" />
      <meta name="referrer" content="strict-origin-when-cross-origin" />
      <link rel="icon" type="image/x-icon" href="favicon.ico" />
      <!-- Fonts are self-hosted (scripts/fetch-fonts.mjs): no third-party host, works offline.
         UI type system: Space Grotesk (display/wordmark), IBM Plex Sans (UI), IBM Plex Mono
         (schema data); plus the canvas text-element families. Icons are inline SVG (dd-icon). -->
      <link rel="stylesheet" href="assets/fonts/fonts.css" />
   </head>
   <body class="mat-typography">
      <dd-root></dd-root>
   </body>
</html>
