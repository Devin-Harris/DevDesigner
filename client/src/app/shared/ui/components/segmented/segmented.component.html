<div class="dd-segmented" role="tablist">
   @for (opt of options$(); track opt.value) {
      <button
         type="button"
         class="seg"
         [class.on]="opt.value === value$()"
         [disabled]="disabled$()"
         (click)="select(opt.value)"
      >
         {{ opt.label }}
      </button>
   }
</div>
