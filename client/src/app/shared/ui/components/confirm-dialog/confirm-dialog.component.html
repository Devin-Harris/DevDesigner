<h2 mat-dialog-title class="dlg-title">{{ data.title }}</h2>
<mat-dialog-content class="dlg-body">
   <p class="msg">{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions class="dlg-actions">
   <button class="btn" type="button" [mat-dialog-close]="false">Cancel</button>
   <button class="btn danger" type="button" [mat-dialog-close]="true" cdkFocusInitial>
      {{ data.confirmLabel ?? 'Confirm' }}
   </button>
</mat-dialog-actions>
