<h2 mat-dialog-title class="dlg-title">{{ title$() }}</h2>

<mat-dialog-content class="dlg-body">
   @if (providers$().length > 0) {
      <div class="oauth">
         @for (p of providers$(); track p.id) {
            <button class="btn oauth-btn" type="button" [disabled]="busy$()" (click)="signInWith(p.id)">
               Continue with {{ p.name }}
            </button>
         }
         <div class="divider"><span>or use email</span></div>
      </div>
   }
   <form class="form" [formGroup]="form" (keydown.enter)="submit()">
      @if (isRegister$()) {
         <label class="field">
            <span class="field-label">Display name (optional)</span>
            <dd-input type="text" formControlName="displayName" />
         </label>
      }

      <label class="field">
         <span class="field-label">Email</span>
         <dd-input type="email" formControlName="email" />
      </label>

      <label class="field">
         <span class="field-label">Password</span>
         <dd-input type="password" formControlName="password" />
         @if (isRegister$()) {
            <span class="hint">At least 8 characters.</span>
         }
      </label>

      @if (error$()) {
         <p class="err">{{ error$() }}</p>
      }

      <button class="link-btn" type="button" (click)="toggleMode()">
         {{ isRegister$() ? 'Have an account? Sign in' : 'Need an account? Create one' }}
      </button>
   </form>
</mat-dialog-content>

<mat-dialog-actions class="dlg-actions">
   <button class="btn" mat-dialog-close type="button">Cancel</button>
   <button class="btn primary" type="button" [disabled]="!canSubmit$()" (click)="submit()">
      @if (busy$()) {
         <mat-progress-spinner mode="indeterminate" diameter="18"></mat-progress-spinner>
      }
      {{ submitLabel$() }}
   </button>
</mat-dialog-actions>
