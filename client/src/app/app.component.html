<div class="shell">
  <mat-toolbar class="topbar">
    <span class="brand-tile"><mat-icon>schema</mat-icon></span>
    <span class="brand">DBDesigner</span>

    @if (projects.selected(); as project) {
      <span class="crumb-sep">/</span>
      <span class="crumb-name">{{ project.name }}</span>
      <button
        class="type-chip"
        [matMenuTriggerFor]="typeMenu"
        matTooltip="Change diagram type"
        aria-label="Change diagram type"
      >
        <span class="type-dot" [style.background]="typeColor(project.type)"></span>
        {{ typeLabel(project.type) }}
        <mat-icon>arrow_drop_down</mat-icon>
      </button>
      <mat-menu #typeMenu="matMenu">
        @for (t of projectTypes; track t) {
          <button mat-menu-item (click)="projects.setType(project.id, t)">
            <span class="type-dot" [style.background]="typeColor(t)"></span>
            <span>{{ typeLabel(t) }}</span>
          </button>
        }
      </mat-menu>
    }

    <span class="spacer"></span>

    @if (auth.currentUser(); as user) {
      <button mat-button [matMenuTriggerFor]="accountMenu" aria-label="Account">
        <mat-icon>account_circle</mat-icon>
        {{ auth.displayLabel() }}
      </button>
      <mat-menu #accountMenu="matMenu">
        @if (user.email) {
          <div style="padding: 8px 16px; color: var(--dbd-text-muted)">{{ user.email }}</div>
        }
        <button mat-menu-item (click)="signOut()">
          <mat-icon>logout</mat-icon><span>Sign out</span>
        </button>
      </mat-menu>
    } @else {
      <button mat-stroked-button (click)="openAuth()">
        <mat-icon>login</mat-icon>
        Sign in
      </button>
    }

    <button
      mat-icon-button
      (click)="theme.toggle()"
      [matTooltip]="theme.dark() ? 'Switch to light' : 'Switch to dark'"
      aria-label="Toggle theme"
    >
      <mat-icon>{{ theme.dark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>
  </mat-toolbar>
  <div class="body">
    <router-outlet />
  </div>
</div>
