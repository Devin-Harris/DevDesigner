<div class="admin-layout">
   <nav class="admin-rail" aria-label="Admin sections">
      <a class="admin-brand" routerLink="/" aria-label="Back to DevDesigner">
         <dd-logo [size]="30" />
         <span class="admin-brand-name">Admin</span>
      </a>
      @for (link of links; track link.path) {
         <a
            class="admin-rail-link"
            routerLinkActive="on"
            ariaCurrentWhenActive="page"
            [routerLink]="link.path"
            [routerLinkActiveOptions]="{ exact: link.exact }"
         >
            <dd-icon [name]="link.icon"></dd-icon><span class="admin-rail-label">{{ link.label }}</span>
         </a>
      }
      <div class="admin-rail-footer">
         <span class="admin-rail-user">{{ userLabel$() }}</span>
         <a class="admin-rail-link" routerLink="/">
            <dd-icon name="arrow_back"></dd-icon><span class="admin-rail-label">Back to app</span>
         </a>
      </div>
   </nav>
   <main class="admin-main">
      <router-outlet></router-outlet>
   </main>
</div>
