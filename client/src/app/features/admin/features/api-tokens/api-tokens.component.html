<header class="page-header">
   <h1 class="page-title">API and MCP</h1>
   <dd-admin-date-range-picker [value]="range$()" (valueChange)="setRange($event)"></dd-admin-date-range-picker>
</header>

@if (view$().error; as error) {
   <p class="page-notice is-error" role="alert">{{ error }}</p>
}

<div class="page-body" [attr.aria-busy]="view$().loading" [class.is-stale]="view$().stale">
   <div class="card-grid">
      <section class="card">
         <h2 class="card-title">MCP tools</h2>
         <p class="card-note">Calls per tool, with errors and p95 latency</p>
         <dd-admin-bar-list
            [emptyText]="'No MCP calls in this period'"
            [items]="tools$()"
            [label]="'MCP tool calls'"
         ></dd-admin-bar-list>
      </section>
      <section class="card">
         <h2 class="card-title">Token traffic</h2>
         <dd-admin-stat-bar [label]="'Token calls by source'" [segments]="sources$()"></dd-admin-stat-bar>
         <h3 class="sub-title">Top routes</h3>
         <dd-admin-bar-list
            [emptyText]="'No token calls in this period'"
            [items]="routes$()"
            [label]="'Top routes called with a token'"
         ></dd-admin-bar-list>
      </section>
      <section class="card card-wide">
         <h2 class="card-title">Tokens</h2>
         <dd-admin-data-table
            [columns]="columns"
            [emptyText]="'No API tokens'"
            [label]="'API tokens'"
            [rows]="tokens$()"
         ></dd-admin-data-table>
      </section>
   </div>
</div>
