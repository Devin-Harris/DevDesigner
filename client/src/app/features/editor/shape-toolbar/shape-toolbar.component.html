<!-- Left vertical tool dock. Icons are thin-stroke inline SVG (design system
     signature) rather than Material glyphs. -->
<div class="dock">
  <button
    class="dock-btn"
    [class.on]="tool() === 'select'"
    [disabled]="disabled()"
    (click)="onChange('select')"
    matTooltip="Select (V)"
    matTooltipPosition="right"
    aria-label="Select"
  >
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 3l6.5 16 2.4-6.6 6.6-2.4L4 3z" />
    </svg>
  </button>

  <div class="dock-sep"></div>

  <button
    class="dock-btn"
    [class.on]="tool() === 'table'"
    [disabled]="disabled()"
    (click)="onChange('table')"
    matTooltip="Table (E)"
    matTooltipPosition="right"
    aria-label="Table"
  >
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3.5" y="4.5" width="17" height="15" rx="2.5" />
      <path d="M3.5 9.5h17M9.5 9.5v10" />
    </svg>
  </button>

  <button
    class="dock-btn shape"
    [class.on]="isShape()"
    [disabled]="disabled()"
    [matMenuTriggerFor]="shapeMenu"
    matTooltip="Shape"
    matTooltipPosition="right"
    aria-label="Shape"
  >
    @switch (shapeIcon()) {
      @case ('circle') {
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" /></svg>
      }
      @case ('diamond') {
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 9-9 9-9-9 9-9z" /></svg>
      }
      @default {
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2.5" /></svg>
      }
    }
    <span class="caret"></span>
  </button>
  <mat-menu #shapeMenu="matMenu" xPosition="after">
    <button mat-menu-item (click)="onChange('rectangle')">
      <mat-icon>crop_square</mat-icon><span>Rectangle</span>
    </button>
    <button mat-menu-item (click)="onChange('ellipse')">
      <mat-icon>circle</mat-icon><span>Ellipse</span>
    </button>
    <button mat-menu-item (click)="onChange('diamond')">
      <mat-icon>diamond</mat-icon><span>Diamond</span>
    </button>
  </mat-menu>

  <button
    class="dock-btn"
    [class.on]="tool() === 'arrow'"
    [disabled]="disabled()"
    (click)="onChange('arrow')"
    matTooltip="Arrow (A)"
    matTooltipPosition="right"
    aria-label="Arrow"
  >
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M5 19L19 5M11 5h8v8" />
    </svg>
  </button>

  <button
    class="dock-btn"
    [class.on]="tool() === 'line'"
    [disabled]="disabled()"
    (click)="onChange('line')"
    matTooltip="Line (L)"
    matTooltipPosition="right"
    aria-label="Line"
  >
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M5 19L19 5" />
    </svg>
  </button>

  <button
    class="dock-btn"
    [class.on]="tool() === 'freedraw'"
    [disabled]="disabled()"
    (click)="onChange('freedraw')"
    matTooltip="Draw (P)"
    matTooltipPosition="right"
    aria-label="Draw"
  >
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M15.5 5.5l3 3M5 19l1-4L16 5l3 3L9 18l-4 1z" />
    </svg>
  </button>

  <button
    class="dock-btn"
    [class.on]="tool() === 'text'"
    [disabled]="disabled()"
    (click)="onChange('text')"
    matTooltip="Text (T)"
    matTooltipPosition="right"
    aria-label="Text"
  >
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M5 6V4.5h14V6M12 4.5v15M9 19.5h6" />
    </svg>
  </button>
</div>

<!-- Bottom-left status / zoom bar -->
<div class="statusbar">
  <button mat-icon-button (click)="undo.emit()" [disabled]="!canUndo()" matTooltip="Undo (Ctrl+Z)">
    <mat-icon>undo</mat-icon>
  </button>
  <button
    mat-icon-button
    (click)="redo.emit()"
    [disabled]="!canRedo()"
    matTooltip="Redo (Ctrl+Shift+Z)"
  >
    <mat-icon>redo</mat-icon>
  </button>

  <span class="sep"></span>

  <button mat-icon-button (click)="zoomOut.emit()" matTooltip="Zoom out">
    <mat-icon>remove</mat-icon>
  </button>
  <button class="zoom-label" (click)="resetView.emit()" matTooltip="Reset view">{{ zoomLabel() }}</button>
  <button mat-icon-button (click)="zoomIn.emit()" matTooltip="Zoom in">
    <mat-icon>add</mat-icon>
  </button>

  <span class="sep"></span>

  <button mat-icon-button [class.on]="gridSnap()" (click)="toggleGrid.emit()" matTooltip="Snap to grid">
    <mat-icon>grid_4x4</mat-icon>
  </button>
  <button
    mat-icon-button
    [matMenuTriggerFor]="alignMenu"
    [disabled]="!canAlign()"
    matTooltip="Align selected"
  >
    <mat-icon>align_horizontal_left</mat-icon>
  </button>
  <mat-menu #alignMenu="matMenu">
    <button mat-menu-item (click)="align.emit('left')">
      <mat-icon>align_horizontal_left</mat-icon><span>Align left</span>
    </button>
    <button mat-menu-item (click)="align.emit('hcenter')">
      <mat-icon>align_horizontal_center</mat-icon><span>Align center (x)</span>
    </button>
    <button mat-menu-item (click)="align.emit('right')">
      <mat-icon>align_horizontal_right</mat-icon><span>Align right</span>
    </button>
    <button mat-menu-item (click)="align.emit('top')">
      <mat-icon>align_vertical_top</mat-icon><span>Align top</span>
    </button>
    <button mat-menu-item (click)="align.emit('vcenter')">
      <mat-icon>align_vertical_center</mat-icon><span>Align middle (y)</span>
    </button>
    <button mat-menu-item (click)="align.emit('bottom')">
      <mat-icon>align_vertical_bottom</mat-icon><span>Align bottom</span>
    </button>
    <button mat-menu-item (click)="align.emit('dist-h')">
      <mat-icon>horizontal_distribute</mat-icon><span>Distribute horizontally</span>
    </button>
    <button mat-menu-item (click)="align.emit('dist-v')">
      <mat-icon>vertical_distribute</mat-icon><span>Distribute vertically</span>
    </button>
  </mat-menu>

  <button
    mat-icon-button
    [disabled]="!canExport()"
    [matMenuTriggerFor]="exportMenu"
    matTooltip="Export"
  >
    <mat-icon>ios_share</mat-icon>
  </button>
  <mat-menu #exportMenu="matMenu">
    <button mat-menu-item (click)="exportSql.emit()">
      <mat-icon>data_object</mat-icon><span>SQL...</span>
    </button>
    <button mat-menu-item (click)="exportImage.emit('png')">
      <mat-icon>photo</mat-icon><span>Image (PNG)</span>
    </button>
    <button mat-menu-item (click)="exportImage.emit('svg')">
      <mat-icon>image</mat-icon><span>Image (SVG)</span>
    </button>
    <button mat-menu-item (click)="exportImage.emit('pdf')">
      <mat-icon>picture_as_pdf</mat-icon><span>Image (PDF)</span>
    </button>
  </mat-menu>

  @if (saveLabel()) {
    <span class="save-label">{{ saveLabel() }}</span>
  }
</div>
