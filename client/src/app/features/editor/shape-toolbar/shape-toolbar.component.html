<!-- Left vertical tool dock. Icons are thin-stroke inline SVG (design system
     signature) rather than Material glyphs. -->
<div class="dock">
  <button
    class="dock-btn"
    [class.on]="tool() === 'select'"
    [disabled]="disabled()"
    (click)="onChange('select')"
    matTooltip="Select (V)"
    matTooltipPosition="right"
    aria-label="Select"
  >
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 3l6.5 16 2.4-6.6 6.6-2.4L4 3z" />
    </svg>
  </button>

  <button
    class="dock-btn"
    [class.on]="tool() === 'hand'"
    [disabled]="disabled()"
    (click)="onChange('hand')"
    matTooltip="Hand / pan (H)"
    matTooltipPosition="right"
    aria-label="Hand"
  >
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M8 11V5.5a1.5 1.5 0 013 0V11m0-.5V4.5a1.5 1.5 0 013 0V11m0-.5V6a1.5 1.5 0 013 0v7.5a6.5 6.5 0 01-6.5 6.5H13a6 6 0 01-4.7-2.3L5 14.5a1.6 1.6 0 012.5-2L8 13V5.5a1.5 1.5 0 013 0"
      />
    </svg>
  </button>

  <div class="dock-sep"></div>

  <button
    class="dock-btn"
    [class.on]="tool() === 'table'"
    [disabled]="disabled()"
    (click)="onChange('table')"
    matTooltip="Table (E)"
    matTooltipPosition="right"
    aria-label="Table"
  >
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3.5" y="4.5" width="17" height="15" rx="2.5" />
      <path d="M3.5 9.5h17M9.5 9.5v10" />
    </svg>
  </button>

  <button
    class="dock-btn shape"
    [class.on]="isShape()"
    [disabled]="disabled()"
    [dbdPopoverTrigger]="shapeMenu"
    placement="right-start"
    (click)="onChange(lastShape())"
    matTooltip="Shape"
    matTooltipPosition="right"
    aria-label="Shape"
  >
    @switch (shapeIcon()) {
      @case ('circle') {
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="8" />
        </svg>
      }
      @case ('diamond') {
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3l9 9-9 9-9-9 9-9z" />
        </svg>
      }
      @default {
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="4" y="5" width="16" height="14" rx="2.5" />
        </svg>
      }
    }
    <span class="caret"></span>
  </button>
  <ng-template #shapeMenu let-close>
    <div class="shape-flyout">
      <button
        class="flyout-btn"
        [class.on]="tool() === 'rectangle'"
        (click)="pickRectangle(0); close()"
        matTooltip="Rectangle (R)"
        matTooltipPosition="above"
      >
        <svg class="ico" viewBox="0 0 24 24">
          <rect x="4" y="5" width="16" height="14" rx="2.5" />
        </svg>
      </button>
      <button
        class="flyout-btn"
        [class.on]="tool() === 'ellipse'"
        (click)="onChange('ellipse'); close()"
        matTooltip="Ellipse (O)"
        matTooltipPosition="above"
      >
        <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /></svg>
      </button>
      <button
        class="flyout-btn"
        [class.on]="tool() === 'diamond'"
        (click)="onChange('diamond'); close()"
        matTooltip="Diamond (D)"
        matTooltipPosition="above"
      >
        <svg class="ico" viewBox="0 0 24 24"><path d="M12 3l9 9-9 9-9-9 9-9z" /></svg>
      </button>
    </div>
  </ng-template>

  <button
    class="dock-btn"
    [class.on]="tool() === 'arrow'"
    [disabled]="disabled()"
    (click)="onChange('arrow')"
    matTooltip="Arrow (A)"
    matTooltipPosition="right"
    aria-label="Arrow"
  >
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M5 19L19 5M11 5h8v8" />
    </svg>
  </button>

  <button
    class="dock-btn"
    [class.on]="tool() === 'line'"
    [disabled]="disabled()"
    (click)="onChange('line')"
    matTooltip="Line (L)"
    matTooltipPosition="right"
    aria-label="Line"
  >
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M5 19L19 5" />
    </svg>
  </button>

  <button
    class="dock-btn"
    [class.on]="tool() === 'freedraw'"
    [disabled]="disabled()"
    (click)="onChange('freedraw')"
    matTooltip="Draw (P)"
    matTooltipPosition="right"
    aria-label="Draw"
  >
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M15.5 5.5l3 3M5 19l1-4L16 5l3 3L9 18l-4 1z" />
    </svg>
  </button>

  <button
    class="dock-btn"
    [class.on]="tool() === 'text'"
    [disabled]="disabled()"
    (click)="onChange('text')"
    matTooltip="Text (T)"
    matTooltipPosition="right"
    aria-label="Text"
  >
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M5 6V4.5h14V6M12 4.5v15M9 19.5h6" />
    </svg>
  </button>

  <div class="dock-sep"></div>

  <!-- Sequence diagram tools -->
  <button
    class="dock-btn"
    [class.on]="tool() === 'lifeline'"
    [disabled]="disabled()"
    (click)="onChange('lifeline')"
    matTooltip="Lifeline (F)"
    matTooltipPosition="right"
    aria-label="Lifeline"
  >
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="6" y="3" width="12" height="7" rx="2" />
      <path d="M12 10v11" stroke-dasharray="3 3" />
    </svg>
  </button>

  <button
    class="dock-btn"
    [class.on]="tool() === 'message'"
    [disabled]="disabled()"
    (click)="onChange('message')"
    matTooltip="Message (M)"
    matTooltipPosition="right"
    aria-label="Message"
  >
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 12h16M14 7l6 5-6 5" />
    </svg>
  </button>
</div>

<!-- Bottom-left status / zoom bar (undo/redo + export now live in the top nav) -->
<div class="statusbar">
  <button class="sbtn" (click)="zoomOut.emit()" matTooltip="Zoom out">
    <dbd-icon name="remove" />
  </button>
  <button class="zoom-label" (click)="resetView.emit()" matTooltip="Reset view">
    {{ zoomLabel() }}
  </button>
  <button class="sbtn" (click)="zoomIn.emit()" matTooltip="Zoom in"><dbd-icon name="add" /></button>

  <span class="sep"></span>

  <button class="sbtn" (click)="resetView.emit()" matTooltip="Fit / reset view">
    <dbd-icon name="center_focus_strong" />
  </button>
  <button
    class="sbtn"
    [class.on]="gridSnap()"
    (click)="toggleGrid.emit()"
    matTooltip="Snap to grid"
  >
    <dbd-icon name="grid_4x4" />
  </button>
  <button
    class="sbtn"
    [dbdPopoverTrigger]="alignMenu"
    placement="above-start"
    [disabled]="!canAlign()"
    matTooltip="Align selected"
  >
    <dbd-icon name="align_horizontal_left" />
  </button>
  <ng-template #alignMenu let-close>
    <div class="dbd-menu">
      <button class="dbd-menu-item" (click)="align.emit('left'); close()">
        <dbd-icon name="align_horizontal_left" />Align left
      </button>
      <button class="dbd-menu-item" (click)="align.emit('hcenter'); close()">
        <dbd-icon name="align_horizontal_center" />Align center (x)
      </button>
      <button class="dbd-menu-item" (click)="align.emit('right'); close()">
        <dbd-icon name="align_horizontal_right" />Align right
      </button>
      <button class="dbd-menu-item" (click)="align.emit('top'); close()">
        <dbd-icon name="align_vertical_top" />Align top
      </button>
      <button class="dbd-menu-item" (click)="align.emit('vcenter'); close()">
        <dbd-icon name="align_vertical_center" />Align middle (y)
      </button>
      <button class="dbd-menu-item" (click)="align.emit('bottom'); close()">
        <dbd-icon name="align_vertical_bottom" />Align bottom
      </button>
      <div class="dbd-menu-sep"></div>
      <button class="dbd-menu-item" (click)="align.emit('dist-h'); close()">
        <dbd-icon name="horizontal_distribute" />Distribute horizontally
      </button>
      <button class="dbd-menu-item" (click)="align.emit('dist-v'); close()">
        <dbd-icon name="vertical_distribute" />Distribute vertically
      </button>
    </div>
  </ng-template>

  @if (saveLabel()) {
    <span class="save-label">{{ saveLabel() }}</span>
  }
</div>
