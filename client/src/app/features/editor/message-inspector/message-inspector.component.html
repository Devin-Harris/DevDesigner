<div class="panel">
  <div class="panel-head">
    <div class="head-text">
      <div class="eyebrow">Sequence diagram</div>
      <div class="kname">Message</div>
    </div>
    <button class="icon-btn del" (click)="onDelete()" [disabled]="!store.canEdit()" title="Delete">
      <dbd-icon name="delete" />
    </button>
  </div>

  <div class="field-label">Label</div>
  <input
    class="text-input"
    type="text"
    [value]="message().label ?? ''"
    placeholder="Optional label"
    [disabled]="!store.canEdit()"
    (change)="onLabelChange($any($event.target).value)"
  />

  <div class="two-col">
    <div>
      <div class="field-label">Style</div>
      <div class="seg-row">
        <button
          class="seg"
          [class.on]="message().style === 'solid'"
          [disabled]="!store.canEdit()"
          (click)="onStyleToggle('solid')"
          title="Solid"
        >
          <span class="stroke-line"></span>
        </button>
        <button
          class="seg"
          [class.on]="message().style === 'dashed'"
          [disabled]="!store.canEdit()"
          (click)="onStyleToggle('dashed')"
          title="Dashed"
        >
          <span class="stroke-line dashed"></span>
        </button>
      </div>
    </div>

    <div>
      <div class="field-label">Direction</div>
      <div class="seg-row">
        <button
          class="seg"
          [class.on]="message().direction === 'forward'"
          [disabled]="!store.canEdit()"
          (click)="onDirectionToggle('forward')"
          title="Forward →"
        >
          <svg width="18" height="10" viewBox="0 0 18 10">
            <line x1="1" y1="5" x2="15" y2="5" stroke="currentColor" stroke-width="1.5"/>
            <polyline points="10,1 15,5 10,9" fill="none" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </button>
        <button
          class="seg"
          [class.on]="message().direction === 'reverse'"
          [disabled]="!store.canEdit()"
          (click)="onDirectionToggle('reverse')"
          title="Reverse ←"
        >
          <svg width="18" height="10" viewBox="0 0 18 10">
            <line x1="3" y1="5" x2="17" y2="5" stroke="currentColor" stroke-width="1.5"/>
            <polyline points="8,1 3,5 8,9" fill="none" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div class="field-label">Arrowhead</div>
  <div class="seg-row">
    <button
      class="seg"
      [class.on]="message().arrowhead === 'arrow'"
      [disabled]="!store.canEdit()"
      (click)="onArrowheadChange('arrow')"
      title="Filled arrow"
    >
      <svg width="18" height="10" viewBox="0 0 18 10">
        <line x1="1" y1="5" x2="13" y2="5" stroke="currentColor" stroke-width="1.5"/>
        <polygon points="10,1 18,5 10,9" fill="currentColor"/>
      </svg>
    </button>
    <button
      class="seg"
      [class.on]="message().arrowhead === 'open'"
      [disabled]="!store.canEdit()"
      (click)="onArrowheadChange('open')"
      title="Open arrow"
    >
      <svg width="18" height="10" viewBox="0 0 18 10">
        <line x1="1" y1="5" x2="13" y2="5" stroke="currentColor" stroke-width="1.5"/>
        <polyline points="10,1 18,5 10,9" fill="none" stroke="currentColor" stroke-width="1.5"/>
      </svg>
    </button>
    <button
      class="seg"
      [class.on]="message().arrowhead === 'none'"
      [disabled]="!store.canEdit()"
      (click)="onArrowheadChange('none')"
      title="No arrowhead"
    >
      <svg width="18" height="10" viewBox="0 0 18 10">
        <line x1="1" y1="5" x2="17" y2="5" stroke="currentColor" stroke-width="1.5"/>
      </svg>
    </button>
  </div>
</div>
