<h2 mat-dialog-title class="dlg-title">Export SQL</h2>

<mat-dialog-content class="dlg-body">
   @if (data.selectionOnly) {
      <p class="hint">Showing DDL for the selected tables only.</p>
   }
   <textarea class="sql" readonly rows="18">{{ data.sql }}</textarea>
</mat-dialog-content>

<mat-dialog-actions class="dlg-actions">
   <button class="btn" mat-dialog-close type="button">Close</button>
   <button class="btn" type="button" (click)="copy()"><dd-icon name="content_copy" />Copy</button>
   <button class="btn primary" type="button" (click)="download()"><dd-icon name="download" />Download .sql</button>
</mat-dialog-actions>
