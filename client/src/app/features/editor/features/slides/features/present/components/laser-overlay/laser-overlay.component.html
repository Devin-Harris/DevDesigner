@if (trails().length) {
   <svg class="laser-svg" aria-hidden="true">
      @for (l of trails(); track l.id) {
         @for (s of l.segments; track $index) {
            <line
               class="trail"
               [attr.x1]="s.x1"
               [attr.y1]="s.y1"
               [attr.x2]="s.x2"
               [attr.y2]="s.y2"
               [attr.stroke-width]="s.width"
               [attr.opacity]="s.opacity"
            />
         }
         @if (l.head; as h) {
            <circle class="glow" r="12" [attr.cx]="h.x" [attr.cy]="h.y" />
            <circle class="dot" r="5" [attr.cx]="h.x" [attr.cy]="h.y" />
         }
      }
   </svg>
}

@if (capturing()) {
   <div
      class="laser-capture"
      ddStopClicks
      (pointerdown)="onDown($event)"
      (pointermove)="onMove($event)"
      (pointerup)="onUp($event)"
      (pointercancel)="onUp($event)"
   ></div>
}
