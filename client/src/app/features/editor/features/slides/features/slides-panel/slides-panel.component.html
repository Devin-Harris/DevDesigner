@switch (part()) {
   @case ('list') {
      <dd-slide-list></dd-slide-list>
   }
   @case ('settings') {
      <dd-slide-settings></dd-slide-settings>
   }
   @case ('focus-list') {
      <dd-focus-slide-list></dd-focus-slide-list>
   }
   @case ('focus-settings') {
      <dd-focus-settings></dd-focus-settings>
   }
   @case ('focus-transition') {
      <dd-focus-transition></dd-focus-transition>
   }
   @case ('design-layouts') {
      <dd-layout-tab></dd-layout-tab>
   }
   @case ('design-theme') {
      <dd-theme-picker></dd-theme-picker>
   }
   @default {
      <!-- theme-menu, design-menu, size-menu -->
      <dd-deck-menus></dd-deck-menus>
   }
}
