<div class="frame" [style.--slide-ar]="aspect$()">
   @for (m of items$(); track m.id) {
      <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -- media on a presented slide; the presenter handles keys on the document -->
      <div
         class="item"
         [class.gif-click]="m.kind === 'gif' && (playbackOf | call: m) === 'click'"
         [style.left.%]="m.left"
         [style.top.%]="m.top"
         [style.width.%]="m.width"
         [style.height.%]="m.height"
         [style.opacity]="m.opacity"
         [style.transform]="m.angle ? 'rotate(' + m.angle + 'deg)' : null"
         [style.border-radius]="m.radius ?? null"
         [style.clip-path]="m.radius ? 'inset(0 round ' + m.radius + ')' : null"
         [style.overflow]="m.radius ? 'hidden' : null"
         (pointerenter)="hovered.set(m.id)"
         (pointerleave)="hovered.set(null)"
         (click)="onClick(m, $event)"
      >
         @if (m.kind === 'embed') {
            <dd-embed-frame [url]="m.url" [interacting]="true" [nonce]="(embeds.nonces$() | at: m.id) ?? 0"></dd-embed-frame>
         } @else if (m.kind === 'video') {
            @if (m.fileId | imageUrl; as src) {
               <dd-media-video
                  [view]="m.view"
                  [src]="src"
                  [poster]="m.fileId | imagePoster"
                  [clickToPlay]="true"
                  [autoplay]="m.view.playback === 'auto'"
               ></dd-media-video>
            }
         } @else {
            <div class="clip" [style.clip-path]="m.view.clip?.css ?? null">
               @if ((gifSrc$() | call: m : (m.fileId | imageUrl) : (m.fileId | imagePoster)); as src) {
                  <img
                     alt=""
                     draggable="false"
                     [src]="src"
                     [style.left.%]="(frame | call: m).left"
                     [style.top.%]="(frame | call: m).top"
                     [style.width.%]="(frame | call: m).width"
                     [style.height.%]="(frame | call: m).height"
                  />
               }
            </div>
         }
      </div>
   }
</div>
