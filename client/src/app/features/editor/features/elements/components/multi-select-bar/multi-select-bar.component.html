<span class="count">{{ count$() }} selected</span>
<span class="sep"></span>
<button class="tb" type="button" placement="below-start" [ddPopoverTrigger]="alignMenu">
   <dd-icon name="align_horizontal_left" />Align<dd-icon name="expand_more" class="chev" />
</button>
<ng-template #alignMenu let-close>
   <div class="align-pop">
      <div class="lab">Align</div>
      <div class="grid6">
         <button
            class="ib"
            type="button"
            matTooltip="Align left"
            aria-label="Align left"
            (click)="align.emit('left'); close()"
         >
            <dd-icon name="align_horizontal_left" />
         </button>
         <button
            class="ib"
            type="button"
            matTooltip="Center horizontally"
            aria-label="Center horizontally"
            (click)="align.emit('hcenter'); close()"
         >
            <dd-icon name="align_horizontal_center" />
         </button>
         <button
            class="ib"
            type="button"
            matTooltip="Align right"
            aria-label="Align right"
            (click)="align.emit('right'); close()"
         >
            <dd-icon name="align_horizontal_right" />
         </button>
         <button
            class="ib"
            type="button"
            matTooltip="Align top"
            aria-label="Align top"
            (click)="align.emit('top'); close()"
         >
            <dd-icon name="align_vertical_top" />
         </button>
         <button
            class="ib"
            type="button"
            matTooltip="Center vertically"
            aria-label="Center vertically"
            (click)="align.emit('vcenter'); close()"
         >
            <dd-icon name="align_vertical_center" />
         </button>
         <button
            class="ib"
            type="button"
            matTooltip="Align bottom"
            aria-label="Align bottom"
            (click)="align.emit('bottom'); close()"
         >
            <dd-icon name="align_vertical_bottom" />
         </button>
      </div>
      <div class="lab gap">Distribute &amp; tidy</div>
      <div class="chips">
         <button class="chip" type="button" [disabled]="!canDistribute$()" (click)="align.emit('dist-h'); close()">
            Horizontally
         </button>
         <button class="chip" type="button" [disabled]="!canDistribute$()" (click)="align.emit('dist-v'); close()">
            Vertically
         </button>
         <button
            class="chip"
            type="button"
            matTooltip="Line up left to right, 40 px apart"
            (click)="align.emit('gaps-h'); close()"
         >
            Equal gaps &#8596; 40
         </button>
         <button
            class="chip"
            type="button"
            matTooltip="Stack top to bottom, 40 px apart"
            (click)="align.emit('gaps-v'); close()"
         >
            Equal gaps &#8597; 40
         </button>
      </div>
   </div>
</ng-template>

@if (canStyle$()) {
   <span class="sep"></span>
   <button
      class="ib"
      type="button"
      placement="below-start"
      matTooltip="Fill for all"
      aria-label="Fill for all"
      [ddPopoverTrigger]="fillMenu"
   >
      <span class="sw fill"></span>
   </button>
   <ng-template #fillMenu let-close>
      <div class="picker">
         <dd-color-swatches noneValue="transparent" noneLabel="No fill" (pick)="fill.emit($event); close()" />
      </div>
   </ng-template>
   <button
      class="ib"
      type="button"
      placement="below-start"
      matTooltip="Stroke for all"
      aria-label="Stroke for all"
      [ddPopoverTrigger]="strokeMenu"
   >
      <span class="sw stroke"></span>
   </button>
   <ng-template #strokeMenu let-close>
      <div class="picker">
         <dd-color-swatches noneValue="transparent" noneLabel="No stroke" (pick)="stroke.emit($event); close()" />
      </div>
   </ng-template>
}

@if (grouped$()) {
   <button class="tb" type="button" matTooltip="Ungroup (Ctrl+Shift+G)" (click)="ungroup.emit()">Ungroup</button>
} @else {
   <button class="tb" type="button" matTooltip="Group (Ctrl+G)" (click)="group.emit()">Group</button>
}

<button
   class="ib"
   type="button"
   placement="below-start"
   matTooltip="Layer order"
   aria-label="Layer order"
   [ddPopoverTrigger]="layerMenu"
>
   <dd-icon name="flip_to_front" />
</button>
<ng-template #layerMenu let-close>
   <div class="dd-menu">
      <button class="dd-menu-item" type="button" (click)="arrange.emit('front'); close()">
         <dd-icon name="flip_to_front" />Bring to front<span class="kbd">Ctrl Shift ]</span>
      </button>
      <button class="dd-menu-item" type="button" (click)="arrange.emit('forward'); close()">
         <dd-icon name="bring_forward" />Bring forward<span class="kbd">Ctrl ]</span>
      </button>
      <button class="dd-menu-item" type="button" (click)="arrange.emit('backward'); close()">
         <dd-icon name="send_backward" />Send backward<span class="kbd">Ctrl [</span>
      </button>
      <button class="dd-menu-item" type="button" (click)="arrange.emit('back'); close()">
         <dd-icon name="flip_to_back" />Send to back<span class="kbd">Ctrl Shift [</span>
      </button>
   </div>
</ng-template>

<button class="ib" type="button" matTooltip="Duplicate" aria-label="Duplicate" (click)="duplicate.emit()">
   <dd-icon name="content_copy" />
</button>
<button class="ib del" type="button" matTooltip="Delete" aria-label="Delete" (click)="remove.emit()">
   <dd-icon name="delete" />
</button>
