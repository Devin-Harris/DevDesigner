<div class="bar">
   <button class="add" type="button" [disabled]="!edits.canEdit$()" (click)="addColumn()">
      <dd-icon name="add" />Column
   </button>

   <span class="sep"></span>

   <button
      class="tb"
      type="button"
      placement="below-start"
      matTooltip="Header color"
      [ddPopoverTrigger]="colorMenu"
      [disabled]="!edits.canEdit$()"
   >
      <span class="dot" [style.background]="table$().color || 'var(--dd-handle)'"></span>
   </button>
   <ng-template #colorMenu let-close>
      <div class="color-grid">
         <dd-color-swatches themeValue="surface" [value]="table$().color" (pick)="setColor($event); close()" />
      </div>
   </ng-template>

   <button
      class="tb"
      type="button"
      placement="below-start"
      matTooltip="Note"
      aria-label="Note"
      [ddPopoverTrigger]="noteMenu"
      [disabled]="!edits.canEdit$()"
   >
      <dd-icon name="edit_note" />
   </button>
   <ng-template #noteMenu>
      <div class="note-pop">
         <textarea
            class="note"
            rows="3"
            placeholder="Add a note…"
            [value]="table$().note ?? ''"
            (change)="setNote($any($event.target).value)"
         ></textarea>
      </div>
   </ng-template>

   <button class="tb txt" type="button" matTooltip="Indexes (in Details)" (click)="inspector.toggle()">
      Indexes · {{ table$().indexes?.length ?? 0 }}
   </button>
   <button class="tb txt" type="button" matTooltip="SQL for the selected tables" (click)="actions.exportSql()">
      SQL
   </button>

   <button
      class="tb"
      type="button"
      matTooltip="Duplicate table"
      aria-label="Duplicate table"
      [disabled]="!edits.canEdit$()"
      (click)="duplicate()"
   >
      <dd-icon name="content_copy" />
   </button>

   <span class="sep"></span>

   <button
      type="button"
      class="tb details"
      title="Details"
      aria-label="Details"
      [class.on]="inspector.shown$()"
      (click)="inspector.toggle()"
   >
      <dd-icon name="tune" />
   </button>
   <button
      class="tb del"
      type="button"
      matTooltip="Delete table"
      aria-label="Delete table"
      [disabled]="!edits.canEdit$()"
      (click)="remove()"
   >
      <dd-icon name="delete" />
   </button>
</div>
