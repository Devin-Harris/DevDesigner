<div class="panel">
   <div class="panel-head">
      <div class="head-text">
         <div class="eyebrow">Relationship</div>
      </div>
      <button
         class="icon-btn del"
         type="button"
         title="Delete relationship"
         aria-label="Delete relationship"
         [disabled]="!store.canEdit()"
         (click)="remove()"
      >
         <dd-icon name="delete" />
      </button>
   </div>

   <div class="field-label">Source column</div>
   <dd-select
      [options]="columnOptions()"
      [ngModel]="relationship().sourceColumnId"
      [disabled]="!store.canEdit()"
      (ngModelChange)="setSource($event)"
   />

   <div class="arrow"><dd-icon name="arrow_downward" /></div>

   <div class="field-label">Target column</div>
   <dd-select
      [options]="columnOptions()"
      [ngModel]="relationship().targetColumnId"
      [disabled]="!store.canEdit()"
      (ngModelChange)="setTarget($event)"
   />

   <div class="field-label">Type</div>
   <dd-select
      [options]="typeOptions"
      [ngModel]="relationship().type"
      [disabled]="!store.canEdit()"
      (ngModelChange)="setType($event)"
   />

   <div class="two-col">
      <div>
         <div class="field-label">On delete</div>
         <dd-select
            [options]="actionOptions"
            [ngModel]="relationship().onDelete ?? ''"
            [disabled]="!store.canEdit()"
            (ngModelChange)="setOnDelete($event)"
         />
      </div>
      <div>
         <div class="field-label">On update</div>
         <dd-select
            [options]="actionOptions"
            [ngModel]="relationship().onUpdate ?? ''"
            [disabled]="!store.canEdit()"
            (ngModelChange)="setOnUpdate($event)"
         />
      </div>
   </div>
</div>
