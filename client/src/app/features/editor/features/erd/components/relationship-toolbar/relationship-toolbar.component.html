<span class="segs">
   <button
      type="button"
      class="seg"
      [class.on]="type$() === 'ONE_TO_ONE'"
      [disabled]="!canEdit$()"
      (click)="setType.emit('ONE_TO_ONE')"
   >
      1 : 1
   </button>
   <button
      type="button"
      class="seg"
      [class.on]="type$() === 'ONE_TO_MANY'"
      [disabled]="!canEdit$()"
      (click)="setType.emit('ONE_TO_MANY')"
   >
      1 : N
   </button>
   <button
      type="button"
      class="seg"
      [class.on]="type$() === 'MANY_TO_MANY'"
      [disabled]="!canEdit$()"
      (click)="setType.emit('MANY_TO_MANY')"
   >
      N : M
   </button>
</span>

<span class="sep"></span>

<button
   type="button"
   class="tb"
   [class.on]="autoRoute$()"
   [disabled]="!canEdit$()"
   [attr.aria-pressed]="autoRoute$()"
   [matTooltip]="autoRoute$() ? 'Best path, avoids tables' : 'Line stays where you put it'"
   (click)="toggleAutoRoute.emit()"
>
   Auto-route
</button>
<button
   type="button"
   class="tb"
   matTooltip="Clear bends and go back to the best path"
   [disabled]="!canEdit$()"
   (click)="resetRoute.emit()"
>
   Reset route
</button>
<button
   type="button"
   class="ib del"
   matTooltip="Delete relationship"
   aria-label="Delete relationship"
   [disabled]="!canEdit$()"
   (click)="deleteRelationship.emit()"
>
   <dd-icon name="delete" />
</button>
