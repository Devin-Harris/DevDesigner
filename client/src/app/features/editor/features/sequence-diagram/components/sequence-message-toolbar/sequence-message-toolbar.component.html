@if (message(); as m) {
   <button
      type="button"
      class="seg"
      [class.active]="m.style === 'solid'"
      [disabled]="!canEdit()"
      (click)="setStyle('solid')"
   >
      Sync
   </button>
   <button
      type="button"
      class="seg"
      [class.active]="m.style === 'dashed'"
      [disabled]="!canEdit()"
      (click)="setStyle('dashed')"
   >
      Return
   </button>
   <button
      type="button"
      class="seg"
      [class.active]="m.style === 'break'"
      [disabled]="!canEdit()"
      (click)="setStyle('break')"
   >
      Break
   </button>

   <span class="divider"></span>

   @if (m.style !== 'break') {
      <button
         type="button"
         class="ico-act"
         title="Flip direction"
         aria-label="Flip direction"
         [disabled]="!canEdit()"
         (click)="flip()"
      >
         <dd-icon name="swap_horiz" />
      </button>
   }

   <button
      type="button"
      class="ico-act"
      title="Auto-wrap label"
      aria-label="Auto-wrap label"
      [class.active]="m.wrap !== false"
      [disabled]="!canEdit()"
      [attr.aria-pressed]="m.wrap !== false"
      (click)="toggleWrap()"
   >
      <dd-icon name="wrap_text" />
   </button>

   <button
      type="button"
      class="ico-act"
      placement="below-start"
      title="Line color"
      aria-label="Line color"
      [ddPopoverTrigger]="colorMenu"
      [disabled]="!canEdit()"
   >
      <span class="color-dot" [style.background]="css(m.color) || 'var(--dd-connector)'"></span>
   </button>
   <ng-template #colorMenu let-close>
      <div class="color-grid">
         <dd-color-swatches
            noneLabel="Default"
            themeValue="theme"
            [value]="m.color"
            (pick)="setColor($event); close()"
         />
      </div>
   </ng-template>

   <button
      type="button"
      class="ico-act"
      title="Edit label"
      aria-label="Edit label"
      [disabled]="!canEdit()"
      (click)="edit()"
   >
      <dd-icon name="edit" />
   </button>

   <button
      type="button"
      class="ico-act details"
      title="Details"
      aria-label="Details"
      [class.on]="inspector.shown()"
      (click)="inspector.toggle()"
   >
      <dd-icon name="tune" />
   </button>
   <button
      type="button"
      class="ico-act del"
      title="Delete message"
      aria-label="Delete message"
      [disabled]="!canEdit()"
      (click)="remove()"
   >
      <dd-icon name="delete" />
   </button>
}
