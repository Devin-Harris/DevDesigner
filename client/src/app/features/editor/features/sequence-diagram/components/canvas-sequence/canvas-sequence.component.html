@for (d of diagrams$(); track d.id) {
   @if (!(hiddenIds$() | has: d.id)) {
      <dd-sequence-diagram
         [diagramId]="d.id"
         [toWorld]="toWorld$()"
         [snap]="snap$()"
         [smartDrag]="smartDrag$()"
         [smartDragEnd]="smartDragEnd$()"
         [diagramsDropped]="diagramsDropped$()"
         [smartEdges]="smartEdges$()"
         [groupResize]="groupResize$()"
         [style.z-index]="(layerZ$() | at: d.id) ?? null"
      />
   }
}
