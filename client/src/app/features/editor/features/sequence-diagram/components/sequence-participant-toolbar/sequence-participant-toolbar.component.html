@if (lifeline(); as l) {
   <button
      type="button"
      class="ico-act"
      placement="below-start"
      title="Header color"
      aria-label="Header color"
      [ddPopoverTrigger]="colorMenu"
      [disabled]="!canEdit()"
   >
      <span class="color-dot" [style.background]="css(l.color) || 'var(--dd-handle)'"></span>
   </button>
   <ng-template #colorMenu let-close>
      <div class="color-grid">
         <div class="grid-label">Fill</div>
         <dd-color-swatches themeValue="surface" [value]="l.color" (pick)="setColor($event)" />
         <div class="grid-label">Stroke</div>
         <dd-color-swatches
            noneLabel="No stroke"
            themeValue="theme"
            [value]="l.strokeColor"
            (pick)="setStroke($event)"
         />
         <div class="grid-label">Text</div>
         <dd-color-swatches noneLabel="Automatic" themeValue="theme" [value]="l.textColor" (pick)="setText($event)" />
      </div>
   </ng-template>

   <span class="divider"></span>

   <button
      type="button"
      class="ico-act"
      title="Rename participant"
      aria-label="Rename participant"
      [disabled]="!canEdit()"
      (click)="edit()"
   >
      <dd-icon name="edit" />
   </button>

   <button
      type="button"
      class="ico-act details"
      title="Details"
      aria-label="Details"
      [class.on]="inspector.shown()"
      (click)="inspector.toggle()"
   >
      <dd-icon name="tune" />
   </button>
   <button
      type="button"
      class="ico-act del"
      title="Delete participant"
      aria-label="Delete participant"
      [disabled]="!canEdit()"
      (click)="remove()"
   >
      <dd-icon name="delete" />
   </button>
}
