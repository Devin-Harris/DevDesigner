<svg
  class="layer"
  [class.passive]="dragging() || !interactive()"
  [style.left.px]="-svgOffset()"
  [style.top.px]="-svgOffset()"
  width="10000"
  height="10000"
>
  <defs>
    <!-- Arrowheads inherit the line's stroke color via context-stroke. -->
    <marker id="dbd-ah-arrow" markerWidth="14" markerHeight="14" refX="9" refY="5"
      orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"
        stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="dbd-ah-triangle" markerWidth="14" markerHeight="14" refX="9" refY="5"
      orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1 1 L10 5 L1 9 Z" fill="context-stroke" stroke="context-stroke"
        stroke-linejoin="round" />
    </marker>
    <marker id="dbd-ah-dot" markerWidth="10" markerHeight="10" refX="5" refY="5"
      orient="auto" markerUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="3.2" fill="context-stroke" />
    </marker>
    <marker id="dbd-ah-bar" markerWidth="10" markerHeight="12" refX="4" refY="6"
      orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M4 1 L4 11" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" />
    </marker>
    <!-- Per-element diagonal hatch fills (fillStyle: 'hachure'). -->
    @for (s of visible(); track s.id) {
      @if (s.hatch; as h) {
        <pattern [attr.id]="h.id" width="7" height="7" patternUnits="userSpaceOnUse"
          patternTransform="rotate(45)">
          <line x1="0" y1="0" x2="0" y2="7" [attr.stroke]="h.color" stroke-width="1.3" />
        </pattern>
      }
    }
  </defs>

  <g [attr.transform]="'translate(' + svgOffset() + ',' + svgOffset() + ')'">
    @if (bindHighlight(); as h) {
      <rect
        class="bind-highlight"
        [attr.x]="h.x - 4"
        [attr.y]="h.y - 4"
        [attr.width]="h.width + 8"
        [attr.height]="h.height + 8"
        rx="8"
      ></rect>
    }
    @for (s of visible(); track s.id) {
      <g [attr.transform]="s.transform" [style.opacity]="s.opacity">
        <!-- Invisible hit target so the element is grabbable over its whole box. -->
        @if (s.rect) {
          <rect
            [class.hit]="s.type !== 'frame'"
            [class.hit-edge]="s.type === 'frame'"
            [attr.x]="s.rect.x"
            [attr.y]="s.rect.y"
            [attr.width]="s.rect.width"
            [attr.height]="s.rect.height"
            (pointerdown)="onBody(s.id, $event)"
          ></rect>
          @if (s.type === 'frame') {
            <!-- Frames are grabbed by the border or the name strip, not the interior. -->
            <rect
              class="hit"
              [attr.x]="s.rect.x"
              [attr.y]="s.rect.y - frameTitleH"
              [attr.width]="frameTitleW"
              [attr.height]="frameTitleH"
              (pointerdown)="onBody(s.id, $event)"
            ></rect>
          }
          <rect
            [attr.x]="s.rect.x"
            [attr.y]="s.rect.y"
            [attr.width]="s.rect.width"
            [attr.height]="s.rect.height"
            [attr.rx]="s.rect.rx"
            [attr.fill]="s.fill"
            [attr.fill-opacity]="s.fillOpacity"
            [attr.stroke]="s.stroke"
            [attr.stroke-width]="s.strokeWidth"
            [attr.stroke-dasharray]="s.dash"
            [attr.pointer-events]="s.type === 'frame' ? 'none' : null"
          ></rect>
        }
        @if (s.image; as img) {
          <!-- Pictures render through <image> (static mode: SVG scripts never run). -->
          @if (images.url(img.fileId); as href) {
            <image
              [attr.href]="href"
              [attr.x]="img.x"
              [attr.y]="img.y"
              [attr.width]="img.width"
              [attr.height]="img.height"
              preserveAspectRatio="none"
              pointer-events="none"
            ></image>
          } @else {
            <rect class="image-pending" [attr.x]="img.x" [attr.y]="img.y"
              [attr.width]="img.width" [attr.height]="img.height" rx="4"></rect>
          }
          <rect
            class="hit"
            [attr.x]="img.x"
            [attr.y]="img.y"
            [attr.width]="img.width"
            [attr.height]="img.height"
            (pointerdown)="onBody(s.id, $event)"
          ></rect>
        }
        @if (s.ellipse) {
          <ellipse
            class="hit"
            [attr.cx]="s.ellipse.cx"
            [attr.cy]="s.ellipse.cy"
            [attr.rx]="s.ellipse.rx"
            [attr.ry]="s.ellipse.ry"
            (pointerdown)="onBody(s.id, $event)"
          ></ellipse>
          <ellipse
            [attr.cx]="s.ellipse.cx"
            [attr.cy]="s.ellipse.cy"
            [attr.rx]="s.ellipse.rx"
            [attr.ry]="s.ellipse.ry"
            [attr.fill]="s.fill"
            [attr.fill-opacity]="s.fillOpacity"
            [attr.stroke]="s.stroke"
            [attr.stroke-width]="s.strokeWidth"
            [attr.stroke-dasharray]="s.dash"
          ></ellipse>
        }
        @if (s.polygon) {
          <polygon
            class="hit"
            [attr.points]="s.polygon"
            (pointerdown)="onBody(s.id, $event)"
          ></polygon>
          <polygon
            [attr.points]="s.polygon"
            [attr.fill]="s.fill"
            [attr.fill-opacity]="s.fillOpacity"
            [attr.stroke]="s.stroke"
            [attr.stroke-width]="s.strokeWidth"
            [attr.stroke-dasharray]="s.dash"
            stroke-linejoin="round"
          ></polygon>
        }
        @if (s.path) {
          <path
            class="hit-stroke"
            [attr.d]="s.path"
            [style.stroke-width.px]="s.strokeWidth + 6"
            (pointerdown)="onBody(s.id, $event)"
          ></path>
          @if (s.freehand) {
            <path [attr.d]="s.path" [attr.fill]="s.fill" stroke="none"></path>
          } @else {
            <path
              [attr.d]="s.path"
              fill="none"
              [attr.stroke]="s.stroke"
              [attr.stroke-width]="s.strokeWidth"
              [attr.stroke-dasharray]="s.dash"
              stroke-linecap="round"
              stroke-linejoin="round"
              [attr.marker-end]="markerUrl(s.markerEnd)"
              [attr.marker-start]="markerUrl(s.markerStart)"
            ></path>
          }
        }
        @if (s.text; as t) {
          <rect
            class="hit"
            [attr.x]="s.bbox.x"
            [attr.y]="s.bbox.y"
            [attr.width]="s.bbox.width"
            [attr.height]="s.bbox.height"
            (pointerdown)="onBody(s.id, $event)"
          ></rect>
          <text
            [attr.visibility]="s.id === editingId() ? 'hidden' : null"
            [attr.fill]="t.color"
            [attr.font-size]="t.fontSize"
            [attr.font-family]="t.fontFamily"
            [attr.font-weight]="t.fontWeight"
            [attr.font-style]="t.fontStyle"
            [attr.text-anchor]="t.anchor"
          >
            @for (line of t.lines; track $index) {
              <tspan [attr.x]="line.x" [attr.y]="line.y">{{ line.text }}</tspan>
            }
          </text>
        }
        @if (s.label; as l) {
          <text
            class="label"
            [attr.visibility]="s.id === editingId() ? 'hidden' : null"
            [attr.fill]="l.color"
            [attr.font-size]="l.fontSize"
            [attr.font-family]="l.fontFamily"
            [attr.font-weight]="l.fontWeight"
            [attr.font-style]="l.fontStyle"
            [attr.text-anchor]="l.anchor"
          >
            @for (line of l.lines; track $index) {
              <tspan [attr.x]="line.x" [attr.y]="line.y">{{ line.text }}</tspan>
            }
          </text>
        }
      </g>

      @if (s.selected && s.id !== editingId()) {
        <g [attr.transform]="s.transform" class="selection">
          @if (s.ends) {
            <!-- Line/arrow: draggable endpoint handles. -->
            <circle
              class="endpoint"
              [attr.cx]="s.ends.start.x"
              [attr.cy]="s.ends.start.y"
              r="6"
              (pointerdown)="onEndpoint(s.id, 'start', $event)"
            ></circle>
            <circle
              class="endpoint"
              [attr.cx]="s.ends.end.x"
              [attr.cy]="s.ends.end.y"
              r="6"
              (pointerdown)="onEndpoint(s.id, 'end', $event)"
            ></circle>
            @if (s.bend; as b) {
              <!-- Drag to bend the line into a curve (drag back to the chord to straighten). -->
              <circle
                class="bend"
                [attr.cx]="b.x"
                [attr.cy]="b.y"
                r="5"
                (pointerdown)="onBend(s.id, $event)"
              ></circle>
            }
          } @else {
            <!-- Shape/text: bounding box, corner resize handles, rotate handle. -->
            <rect
              class="sel-box"
              [attr.x]="s.bbox.x"
              [attr.y]="s.bbox.y"
              [attr.width]="s.bbox.width"
              [attr.height]="s.bbox.height"
            ></rect>
            <line
              class="rotate-stem"
              [attr.x1]="s.bbox.x + s.bbox.width / 2"
              [attr.y1]="s.bbox.y"
              [attr.x2]="s.bbox.x + s.bbox.width / 2"
              [attr.y2]="s.bbox.y - 24"
            ></line>
            <circle
              class="rotate"
              [attr.cx]="s.bbox.x + s.bbox.width / 2"
              [attr.cy]="s.bbox.y - 24"
              r="6"
              (pointerdown)="onRotate(s.id, $event)"
            ></circle>
            <rect
              class="handle"
              [attr.x]="s.bbox.x - 5"
              [attr.y]="s.bbox.y - 5"
              width="10"
              height="10"
              (pointerdown)="onResize(s.id, 'nw', $event)"
            ></rect>
            <rect
              class="handle"
              [attr.x]="s.bbox.x + s.bbox.width - 5"
              [attr.y]="s.bbox.y - 5"
              width="10"
              height="10"
              (pointerdown)="onResize(s.id, 'ne', $event)"
            ></rect>
            <rect
              class="handle"
              [attr.x]="s.bbox.x - 5"
              [attr.y]="s.bbox.y + s.bbox.height - 5"
              width="10"
              height="10"
              (pointerdown)="onResize(s.id, 'sw', $event)"
            ></rect>
            <rect
              class="handle"
              [attr.x]="s.bbox.x + s.bbox.width - 5"
              [attr.y]="s.bbox.y + s.bbox.height - 5"
              width="10"
              height="10"
              (pointerdown)="onResize(s.id, 'se', $event)"
            ></rect>
          }
        </g>
      }
    }
  </g>
</svg>
