<svg
   class="layer"
   [class.passive]="dragging() || !interactive()"
   [style.left.px]="-svgOffset()"
   [style.top.px]="-svgOffset()"
   width="10000"
   height="10000"
>
   <defs>
      <!-- Arrowheads inherit the line's stroke color via context-stroke. -->
      <marker
         id="dd-ah-arrow"
         markerWidth="14"
         markerHeight="14"
         refX="9"
         refY="5"
         orient="auto-start-reverse"
         markerUnits="userSpaceOnUse"
      >
         <path
            d="M1 1 L9 5 L1 9"
            fill="none"
            stroke="context-stroke"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
         />
      </marker>
      <marker
         id="dd-ah-triangle"
         markerWidth="14"
         markerHeight="14"
         refX="9"
         refY="5"
         orient="auto-start-reverse"
         markerUnits="userSpaceOnUse"
      >
         <path d="M1 1 L10 5 L1 9 Z" fill="context-stroke" stroke="context-stroke" stroke-linejoin="round" />
      </marker>
      <marker
         id="dd-ah-dot"
         markerWidth="10"
         markerHeight="10"
         refX="5"
         refY="5"
         orient="auto"
         markerUnits="userSpaceOnUse"
      >
         <circle cx="5" cy="5" r="3.2" fill="context-stroke" />
      </marker>
      <marker
         id="dd-ah-bar"
         markerWidth="10"
         markerHeight="12"
         refX="4"
         refY="6"
         orient="auto-start-reverse"
         markerUnits="userSpaceOnUse"
      >
         <path d="M4 1 L4 11" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" />
      </marker>
      <!-- Per-element diagonal hatch fills (fillStyle: 'hachure'). -->
      @for (s of visible(); track s.id) {
         @if (s.hatch; as h) {
            <pattern [attr.id]="h.id" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
               <line x1="0" y1="0" x2="0" y2="7" [attr.stroke]="h.color" stroke-width="1.3" />
            </pattern>
         }
         @if (s.grid; as g) {
            <clipPath [attr.id]="g.clipId">
               <rect
                  [attr.x]="g.rect.x"
                  [attr.y]="g.rect.y"
                  [attr.width]="g.rect.width"
                  [attr.height]="g.rect.height"
                  [attr.rx]="g.rect.rx"
               ></rect>
            </clipPath>
         }
         @if (s.image?.clip; as ic) {
            <!-- A cropped or clipped picture shows only its box / clip shape. -->
            <clipPath [attr.id]="ic.id">
               @if (ic.rect; as r) {
                  <rect
                     [attr.x]="r.x"
                     [attr.y]="r.y"
                     [attr.width]="r.width"
                     [attr.height]="r.height"
                     [attr.rx]="r.rx"
                  ></rect>
               } @else if (ic.ellipse; as e) {
                  <ellipse [attr.cx]="e.cx" [attr.cy]="e.cy" [attr.rx]="e.rx" [attr.ry]="e.ry"></ellipse>
               } @else {
                  <polygon [attr.points]="ic.polygon"></polygon>
               }
            </clipPath>
         }
         @if (s.code; as c) {
            <!-- Keeps code that outgrows a resized card inside it. -->
            <clipPath [attr.id]="c.clipId">
               <rect
                  [attr.x]="c.rect.x"
                  [attr.y]="c.rect.y"
                  [attr.width]="c.rect.width"
                  [attr.height]="c.rect.height"
                  [attr.rx]="c.rect.rx"
               ></rect>
            </clipPath>
         }
      }
   </defs>

   <g [attr.transform]="'translate(' + svgOffset() + ',' + svgOffset() + ')'">
      @if (bindHighlight(); as h) {
         <rect
            class="bind-highlight"
            [attr.x]="h.x - 4"
            [attr.y]="h.y - 4"
            [attr.width]="h.width + 8"
            [attr.height]="h.height + 8"
            rx="8"
         ></rect>
      }
      @for (s of visible(); track s.id) {
         @if (s.frameClip; as fc) {
            <clipPath [attr.id]="'fclip-' + s.id">
               <rect [attr.x]="fc.x" [attr.y]="fc.y" [attr.width]="fc.width" [attr.height]="fc.height"></rect>
            </clipPath>
         }
         <g [attr.clip-path]="s.frameClip ? 'url(#fclip-' + s.id + ')' : null">
            <g [attr.transform]="s.transform" [style.opacity]="s.opacity" [class.locked]="s.locked">
               <!-- Invisible hit target so the element is grabbable over its whole box. -->
               @if (s.rect) {
                  <rect
                     [class.hit]="s.type !== 'frame'"
                     [class.hit-edge]="s.type === 'frame'"
                     [attr.x]="s.rect.x"
                     [attr.y]="s.rect.y"
                     [attr.width]="s.rect.width"
                     [attr.height]="s.rect.height"
                     (pointerdown)="onBody(s.id, $event)"
                  ></rect>
                  @if (s.type === 'frame' && s.label) {
                     <!-- Frames are grabbed by the border or the name strip, not the interior. -->
                     <rect
                        class="hit"
                        [attr.x]="s.rect.x"
                        [attr.y]="s.rect.y - frameTitleH"
                        [attr.width]="frameTitleW"
                        [attr.height]="frameTitleH"
                        (pointerdown)="onBody(s.id, $event)"
                     ></rect>
                  }
                  <rect
                     [attr.x]="s.rect.x"
                     [attr.y]="s.rect.y"
                     [attr.width]="s.rect.width"
                     [attr.height]="s.rect.height"
                     [attr.rx]="s.rect.rx"
                     [attr.fill]="s.fill"
                     [attr.fill-opacity]="s.fillOpacity"
                     [attr.stroke]="s.stroke"
                     [attr.stroke-width]="s.strokeWidth"
                     [attr.stroke-dasharray]="s.dash"
                     [attr.pointer-events]="s.type === 'frame' ? 'none' : null"
                  ></rect>
               }
               @if (s.image; as img) {
                  <rect
                     class="hit"
                     [attr.x]="img.x"
                     [attr.y]="img.y"
                     [attr.width]="img.width"
                     [attr.height]="img.height"
                     (pointerdown)="onBody(s.id, $event)"
                     (pointerenter)="hoveredId.set(s.id)"
                     (pointerleave)="hoveredId.set(null)"
                  ></rect>
                  @if (croppingId() === s.id) {
                     <!-- Drawn by the crop overlay while cropping. -->
                  } @else if (images.kind(img.fileId) === 'video' && images.url(img.fileId); as href) {
                     <!-- Videos play in a small HTML player (scales with the canvas zoom). -->
                     <foreignObject
                        [attr.x]="img.x"
                        [attr.y]="img.y"
                        [attr.width]="img.width"
                        [attr.height]="img.height"
                        pointer-events="none"
                     >
                        <app-media-video
                           [view]="img"
                           [src]="$any(href)"
                           [poster]="images.posterUrl(img.fileId)"
                           [controls]="s.selected && interactive()"
                        ></app-media-video>
                     </foreignObject>
                  } @else if (pictureHref(s.id, img, s.selected); as href) {
                     <!-- Pictures render through <image> (static mode: SVG scripts never run). -->
                     <image
                        [attr.href]="href"
                        [attr.x]="img.src.x"
                        [attr.y]="img.src.y"
                        [attr.width]="img.src.width"
                        [attr.height]="img.src.height"
                        [attr.clip-path]="img.clip ? 'url(#' + img.clip.id + ')' : null"
                        preserveAspectRatio="none"
                        pointer-events="none"
                        [attr.role]="img.alt ? 'img' : null"
                        [attr.aria-label]="img.alt || null"
                     >
                        @if (img.alt) {
                           <title>{{ img.alt }}</title>
                        }
                     </image>
                  } @else {
                     <rect
                        class="image-pending"
                        [attr.x]="img.x"
                        [attr.y]="img.y"
                        [attr.width]="img.width"
                        [attr.height]="img.height"
                        rx="4"
                     ></rect>
                  }
               }
               @if (s.grid; as g) {
                  <rect
                     [attr.x]="g.rect.x"
                     [attr.y]="g.rect.y"
                     [attr.width]="g.rect.width"
                     [attr.height]="g.rect.height"
                     [attr.rx]="g.rect.rx"
                     [attr.fill]="g.background"
                     [attr.fill-opacity]="s.fillOpacity"
                     stroke="none"
                  ></rect>
                  <g [attr.clip-path]="'url(#' + g.clipId + ')'" pointer-events="none">
                     @if (g.header; as h) {
                        <rect
                           [attr.x]="h.x"
                           [attr.y]="h.y"
                           [attr.width]="h.width"
                           [attr.height]="h.height"
                           [attr.fill]="h.fill"
                           fill-opacity="0.12"
                        ></rect>
                     }
                     @for (f of g.fills; track $index) {
                        <rect
                           [attr.x]="f.x"
                           [attr.y]="f.y"
                           [attr.width]="f.width"
                           [attr.height]="f.height"
                           [attr.fill]="f.fill"
                        ></rect>
                     }
                     @if (cellRangeRect(s.id, g); as a) {
                        <rect
                           class="grid-active"
                           [attr.x]="a.x"
                           [attr.y]="a.y"
                           [attr.width]="a.width"
                           [attr.height]="a.height"
                        ></rect>
                     }
                     @for (l of g.lines; track $index) {
                        <line
                           [attr.x1]="l.x1"
                           [attr.y1]="l.y1"
                           [attr.x2]="l.x2"
                           [attr.y2]="l.y2"
                           [attr.stroke]="s.stroke"
                           [attr.stroke-width]="s.strokeWidth * 0.75"
                           [attr.stroke-dasharray]="s.dash"
                           stroke-opacity="0.55"
                        ></line>
                     }
                     @for (t of g.cells; track $index) {
                        @for (line of t.lines; track $index) {
                           <text
                              [attr.x]="line.x"
                              [attr.y]="line.y"
                              [attr.font-size]="t.fontSize"
                              [attr.font-family]="t.fontFamily"
                              [attr.font-weight]="t.fontWeight"
                              [attr.font-style]="t.fontStyle"
                              [attr.fill]="t.color"
                              [attr.text-anchor]="t.anchor"
                              xml:space="preserve"
                           >
                              {{ line.text }}
                           </text>
                        }
                     }
                  </g>
                  @if (g.outline) {
                     <rect
                        [attr.x]="g.rect.x"
                        [attr.y]="g.rect.y"
                        [attr.width]="g.rect.width"
                        [attr.height]="g.rect.height"
                        [attr.rx]="g.rect.rx"
                        fill="none"
                        [attr.stroke]="s.stroke"
                        [attr.stroke-width]="s.strokeWidth"
                        [attr.stroke-dasharray]="s.dash"
                        pointer-events="none"
                     ></rect>
                  }
                  <rect
                     class="hit"
                     [attr.x]="g.rect.x"
                     [attr.y]="g.rect.y"
                     [attr.width]="g.rect.width"
                     [attr.height]="g.rect.height"
                     [class.cells]="s.selected"
                     (pointerdown)="onBody(s.id, $event)"
                  ></rect>
                  @if (s.selected && interactive() && s.id !== editingId()) {
                     <!-- Drag a border to resize its column/row; the last ones grow the table. -->
                     @for (x of g.colEdges; track $index; let i = $index) {
                        @if (i > 0) {
                           <rect
                              class="grid-border col"
                              [attr.x]="x - 4"
                              [attr.y]="g.rect.y"
                              width="8"
                              [attr.height]="g.rect.height"
                              (pointerdown)="onGridBorder(s.id, 'col', i - 1, $event)"
                           ></rect>
                        }
                     }
                     @for (y of g.rowEdges; track $index; let i = $index) {
                        @if (i > 0) {
                           <rect
                              class="grid-border row"
                              [attr.x]="g.rect.x"
                              [attr.y]="y - 4"
                              [attr.width]="g.rect.width"
                              height="8"
                              (pointerdown)="onGridBorder(s.id, 'row', i - 1, $event)"
                           ></rect>
                        }
                     }
                     <!-- Structure controls on the edges: + on a border inserts there, - on a column/row removes it. -->
                     @for (x of g.colEdges; track $index; let i = $index) {
                        <g
                           class="grid-ctl add"
                           [attr.transform]="'translate(' + x + ' ' + (g.rect.y - 14) + ')'"
                           (pointerdown)="onGridCtl(s.id, 'addCol', i, $event)"
                        >
                           <title>Insert column</title>
                           <circle r="7"></circle>
                           <path d="M-3.5 0h7M0 -3.5v7"></path>
                        </g>
                        @if (i < g.colEdges.length - 1 && g.colEdges.length > 2) {
                           <g
                              class="grid-ctl del"
                              [attr.transform]="
                                 'translate(' + (x + g.colEdges[i + 1]) / 2 + ' ' + (g.rect.y - 14) + ')'
                              "
                              (pointerdown)="onGridCtl(s.id, 'delCol', i, $event)"
                           >
                              <title>Delete column</title>
                              <circle r="7"></circle>
                              <path d="M-3.5 0h7"></path>
                           </g>
                        }
                     }
                     @for (y of g.rowEdges; track $index; let i = $index) {
                        <g
                           class="grid-ctl add"
                           [attr.transform]="'translate(' + (g.rect.x - 14) + ' ' + y + ')'"
                           (pointerdown)="onGridCtl(s.id, 'addRow', i, $event)"
                        >
                           <title>Insert row</title>
                           <circle r="7"></circle>
                           <path d="M-3.5 0h7M0 -3.5v7"></path>
                        </g>
                        @if (i < g.rowEdges.length - 1 && g.rowEdges.length > 2) {
                           <g
                              class="grid-ctl del"
                              [attr.transform]="
                                 'translate(' + (g.rect.x - 14) + ' ' + (y + g.rowEdges[i + 1]) / 2 + ')'
                              "
                              (pointerdown)="onGridCtl(s.id, 'delRow', i, $event)"
                           >
                              <title>Delete row</title>
                              <circle r="7"></circle>
                              <path d="M-3.5 0h7"></path>
                           </g>
                        }
                     }
                  }
               }
               @if (s.code; as c) {
                  <rect
                     [attr.x]="c.rect.x"
                     [attr.y]="c.rect.y"
                     [attr.width]="c.rect.width"
                     [attr.height]="c.rect.height"
                     [attr.rx]="c.rect.rx"
                     [attr.fill]="c.background"
                     [attr.stroke]="s.stroke"
                     [attr.stroke-width]="s.strokeWidth"
                     [attr.stroke-dasharray]="s.dash"
                  ></rect>
                  <g [attr.clip-path]="'url(#' + c.clipId + ')'" class="code" pointer-events="none">
                     @if (c.header; as h) {
                        <rect
                           [attr.x]="c.rect.x"
                           [attr.y]="c.rect.y"
                           [attr.width]="c.rect.width"
                           [attr.height]="h.height"
                           [attr.fill]="h.tint"
                           fill-opacity="0.14"
                        ></rect>
                        <line
                           [attr.x1]="c.rect.x"
                           [attr.x2]="c.rect.x + c.rect.width"
                           [attr.y1]="c.rect.y + h.height"
                           [attr.y2]="c.rect.y + h.height"
                           [attr.stroke]="h.tint"
                           stroke-opacity="0.35"
                        ></line>
                        <text
                           [attr.x]="h.x"
                           [attr.y]="h.y"
                           font-size="12"
                           text-anchor="middle"
                           [attr.font-family]="c.fontFamily"
                           [attr.fill]="h.color"
                        >
                           {{ h.text }}
                        </text>
                        @for (d of h.dots; track $index) {
                           <circle [attr.cx]="d.x" [attr.cy]="d.y" [attr.r]="d.r" [attr.fill]="d.color"></circle>
                        }
                     }
                     @for (b of c.bands; track $index) {
                        <rect
                           [attr.x]="b.x"
                           [attr.y]="b.y"
                           [attr.width]="b.width"
                           [attr.height]="b.height"
                           [attr.fill]="b.fill"
                        ></rect>
                     }
                     @if (c.divider; as dv) {
                        <line
                           [attr.x1]="dv.x"
                           [attr.x2]="dv.x"
                           [attr.y1]="dv.y1"
                           [attr.y2]="dv.y2"
                           [attr.stroke]="dv.color"
                           stroke-opacity="0.35"
                        ></line>
                     }
                     @for (line of c.lines; track $index) {
                        @if (line.oldNumber; as on) {
                           <text
                              [attr.x]="on.x"
                              [attr.y]="line.y"
                              text-anchor="end"
                              [attr.font-size]="c.fontSize"
                              [attr.font-family]="c.fontFamily"
                              [attr.fill]="c.numberColor"
                           >
                              {{ on.text }}
                           </text>
                        }
                        @if (line.sign; as sg) {
                           <text
                              [attr.x]="sg.x"
                              [attr.y]="line.y"
                              [attr.font-size]="c.fontSize"
                              [attr.font-family]="c.fontFamily"
                              [attr.fill]="sg.color"
                           >
                              {{ sg.text }}
                           </text>
                        }
                        <text
                           [attr.x]="line.numberX ?? c.numberX"
                           [attr.y]="line.y"
                           text-anchor="end"
                           [attr.font-size]="c.fontSize"
                           [attr.font-family]="c.fontFamily"
                           [attr.fill]="c.numberColor"
                        >
                           {{ line.number }}
                        </text>
                        <text
                           [attr.x]="line.textX ?? c.textX"
                           [attr.y]="line.y"
                           xml:space="preserve"
                           [attr.font-size]="c.fontSize"
                           [attr.font-family]="c.fontFamily"
                        >
                           @for (t of line.tokens; track $index) {
                              <tspan [attr.fill]="t.color" [attr.font-style]="t.italic ? 'italic' : null">
                                 {{ t.text }}
                              </tspan>
                           }
                        </text>
                     }
                  </g>
                  <rect
                     class="hit"
                     [attr.x]="c.rect.x"
                     [attr.y]="c.rect.y"
                     [attr.width]="c.rect.width"
                     [attr.height]="c.rect.height"
                     (pointerdown)="onBody(s.id, $event)"
                  ></rect>
                  @if (interactive() && c.divider; as dv) {
                     <!-- Split diff: drag the middle rule to give either side more room. -->
                     <rect
                        class="diff-divider"
                        [attr.x]="dv.x - 4"
                        [attr.y]="dv.y1"
                        width="8"
                        [attr.height]="dv.y2 - dv.y1"
                        (pointerdown)="onDiffDivider(s.id, $event)"
                     >
                        <title>Drag to resize the sides</title>
                     </rect>
                  }
                  @if (interactive()) {
                     <!-- Window dots: red deletes, yellow collapses/expands, green fits to content. -->
                     @for (d of c.header.dots; track $index) {
                        <circle
                           class="code-dot"
                           [attr.cx]="d.x"
                           [attr.cy]="d.y"
                           [attr.r]="d.r + 3"
                           (pointerdown)="onDot(d.action, s.id, $event)"
                        ></circle>
                     }
                  }
               }
               @if (s.ellipse) {
                  <ellipse
                     class="hit"
                     [attr.cx]="s.ellipse.cx"
                     [attr.cy]="s.ellipse.cy"
                     [attr.rx]="s.ellipse.rx"
                     [attr.ry]="s.ellipse.ry"
                     (pointerdown)="onBody(s.id, $event)"
                  ></ellipse>
                  <ellipse
                     [attr.cx]="s.ellipse.cx"
                     [attr.cy]="s.ellipse.cy"
                     [attr.rx]="s.ellipse.rx"
                     [attr.ry]="s.ellipse.ry"
                     [attr.fill]="s.fill"
                     [attr.fill-opacity]="s.fillOpacity"
                     [attr.stroke]="s.stroke"
                     [attr.stroke-width]="s.strokeWidth"
                     [attr.stroke-dasharray]="s.dash"
                  ></ellipse>
               }
               @if (s.polygon) {
                  <polygon class="hit" [attr.points]="s.polygon" (pointerdown)="onBody(s.id, $event)"></polygon>
                  <polygon
                     [attr.points]="s.polygon"
                     [attr.fill]="s.fill"
                     [attr.fill-opacity]="s.fillOpacity"
                     [attr.stroke]="s.stroke"
                     [attr.stroke-width]="s.strokeWidth"
                     [attr.stroke-dasharray]="s.dash"
                     stroke-linejoin="round"
                  ></polygon>
               }
               @if (s.path) {
                  <path
                     class="hit-stroke"
                     [attr.d]="s.path"
                     [style.stroke-width.px]="s.strokeWidth + 6"
                     (pointerdown)="onBody(s.id, $event)"
                  ></path>
                  @if (s.freehand) {
                     <path [attr.d]="s.path" [attr.fill]="s.fill" stroke="none"></path>
                  } @else {
                     <path
                        [attr.d]="s.path"
                        fill="none"
                        [attr.stroke]="s.stroke"
                        [attr.stroke-width]="s.strokeWidth"
                        [attr.stroke-dasharray]="s.dash"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        [attr.marker-end]="markerUrl(s.markerEnd)"
                        [attr.marker-start]="markerUrl(s.markerStart)"
                     ></path>
                  }
               }
               @if (s.text; as t) {
                  <rect
                     class="hit"
                     [attr.x]="s.bbox.x"
                     [attr.y]="s.bbox.y"
                     [attr.width]="s.bbox.width"
                     [attr.height]="s.bbox.height"
                     (pointerdown)="onBody(s.id, $event)"
                  ></rect>
                  <text
                     xml:space="preserve"
                     style="white-space: pre"
                     [attr.visibility]="s.id === editingId() ? 'hidden' : null"
                     [attr.fill]="t.color"
                     [attr.font-size]="t.fontSize"
                     [attr.font-family]="t.fontFamily"
                     [attr.font-weight]="t.fontWeight"
                     [attr.font-style]="t.fontStyle"
                     [attr.text-anchor]="t.anchor"
                  >
                     @for (line of t.lines; track $index) {
                        <tspan [attr.x]="line.x" [attr.y]="line.y" style="white-space: pre">
                           @if (line.spans; as spans) {
                              @for (sp of spans; track $index) {
                                 <tspan
                                    [attr.font-weight]="sp.fontWeight"
                                    [attr.font-style]="sp.fontStyle"
                                    [attr.fill]="sp.color"
                                    [attr.text-decoration]="sp.underline ? 'underline' : null"
                                 >
                                    {{ sp.text }}
                                 </tspan>
                              }
                           } @else {
                              {{ line.text }}
                           }
                        </tspan>
                     }
                  </text>
               }
               @if (s.label; as l) {
                  <text
                     class="label"
                     xml:space="preserve"
                     style="white-space: pre"
                     [attr.visibility]="s.id === editingId() ? 'hidden' : null"
                     [attr.fill]="l.color"
                     [attr.font-size]="l.fontSize"
                     [attr.font-family]="l.fontFamily"
                     [attr.font-weight]="l.fontWeight"
                     [attr.font-style]="l.fontStyle"
                     [attr.text-anchor]="l.anchor"
                  >
                     @for (line of l.lines; track $index) {
                        <tspan [attr.x]="line.x" [attr.y]="line.y" style="white-space: pre">
                           @if (line.spans; as spans) {
                              @for (sp of spans; track $index) {
                                 <tspan
                                    [attr.font-weight]="sp.fontWeight"
                                    [attr.font-style]="sp.fontStyle"
                                    [attr.fill]="sp.color"
                                    [attr.text-decoration]="sp.underline ? 'underline' : null"
                                 >
                                    {{ sp.text }}
                                 </tspan>
                              }
                           } @else {
                              {{ line.text }}
                           }
                        </tspan>
                     }
                  </text>
               }
            </g>
         </g>

         @if (s.selected && s.id !== editingId() && s.id !== croppingId()) {
            <g [attr.transform]="s.transform" class="selection">
               @if (s.ends) {
                  <!-- Line/arrow: draggable endpoint handles. -->
                  <circle
                     class="endpoint"
                     [attr.cx]="s.ends.start.x"
                     [attr.cy]="s.ends.start.y"
                     r="6"
                     (pointerdown)="onEndpoint(s.id, 'start', $event)"
                  ></circle>
                  <circle
                     class="endpoint"
                     [attr.cx]="s.ends.end.x"
                     [attr.cy]="s.ends.end.y"
                     r="6"
                     (pointerdown)="onEndpoint(s.id, 'end', $event)"
                  ></circle>
                  @if (s.bend; as b) {
                     <!-- Drag to bend the line into a curve (drag back to the chord to straighten). -->
                     <circle
                        class="bend"
                        [attr.cx]="b.x"
                        [attr.cy]="b.y"
                        r="5"
                        (pointerdown)="onBend(s.id, $event)"
                     ></circle>
                  }
               } @else {
                  <!-- Shape/text: bounding box, corner resize handles, rotate handle. -->
                  <rect
                     class="sel-box"
                     [attr.x]="s.bbox.x"
                     [attr.y]="s.bbox.y"
                     [attr.width]="s.bbox.width"
                     [attr.height]="s.bbox.height"
                  ></rect>
                  @if (s.type !== 'grid') {
                     <line
                        class="rotate-stem"
                        [attr.x1]="s.bbox.x + s.bbox.width / 2"
                        [attr.y1]="s.bbox.y"
                        [attr.x2]="s.bbox.x + s.bbox.width / 2"
                        [attr.y2]="s.bbox.y - 24"
                     ></line>
                     <circle
                        class="rotate"
                        [attr.cx]="s.bbox.x + s.bbox.width / 2"
                        [attr.cy]="s.bbox.y - 24"
                        r="6"
                        (pointerdown)="onRotate(s.id, $event)"
                     ></circle>
                  }
                  <rect
                     class="handle"
                     [attr.x]="s.bbox.x - 5"
                     [attr.y]="s.bbox.y - 5"
                     width="10"
                     height="10"
                     (pointerdown)="onResize(s.id, 'nw', $event)"
                  ></rect>
                  <rect
                     class="handle"
                     [attr.x]="s.bbox.x + s.bbox.width - 5"
                     [attr.y]="s.bbox.y - 5"
                     width="10"
                     height="10"
                     (pointerdown)="onResize(s.id, 'ne', $event)"
                  ></rect>
                  <rect
                     class="handle"
                     [attr.x]="s.bbox.x - 5"
                     [attr.y]="s.bbox.y + s.bbox.height - 5"
                     width="10"
                     height="10"
                     (pointerdown)="onResize(s.id, 'sw', $event)"
                  ></rect>
                  <rect
                     class="handle"
                     [attr.x]="s.bbox.x + s.bbox.width - 5"
                     [attr.y]="s.bbox.y + s.bbox.height - 5"
                     width="10"
                     height="10"
                     (pointerdown)="onResize(s.id, 'se', $event)"
                  ></rect>
                  @if (s.type === 'text') {
                     <!-- Side handles set a fixed width: the text wraps and the height follows it. -->
                     <rect
                        class="handle side"
                        rx="3"
                        [attr.x]="s.bbox.x - 4"
                        [attr.y]="s.bbox.y + s.bbox.height / 2 - 9"
                        width="8"
                        height="18"
                        (pointerdown)="onResize(s.id, 'w', $event)"
                     ></rect>
                     <rect
                        class="handle side"
                        rx="3"
                        [attr.x]="s.bbox.x + s.bbox.width - 4"
                        [attr.y]="s.bbox.y + s.bbox.height / 2 - 9"
                        width="8"
                        height="18"
                        (pointerdown)="onResize(s.id, 'e', $event)"
                     ></rect>
                  }
               }
            </g>
         }
      }
   </g>
</svg>
