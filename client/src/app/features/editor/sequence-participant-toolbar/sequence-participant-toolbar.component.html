@if (lifeline(); as l) {
  <button
    type="button"
    class="ico-act"
    [dbdPopoverTrigger]="colorMenu"
    placement="below-start"
    [disabled]="!canEdit()"
    title="Header color"
    aria-label="Header color"
  >
    <span class="color-dot" [style.background]="css(l.color) || 'var(--dbd-handle)'"></span>
  </button>
  <ng-template #colorMenu let-close>
    <div class="color-grid">
      <div class="grid-label">Fill</div>
      <dbd-color-swatches [value]="l.color" themeValue="surface" (pick)="setColor($event)" />
      <div class="grid-label">Stroke</div>
      <dbd-color-swatches [value]="l.strokeColor" noneLabel="No stroke" themeValue="theme" (pick)="setStroke($event)" />
      <div class="grid-label">Text</div>
      <dbd-color-swatches [value]="l.textColor" noneLabel="Automatic" themeValue="theme" (pick)="setText($event)" />
    </div>
  </ng-template>

  <span class="divider"></span>

  <button
    type="button"
    class="ico-act"
    [disabled]="!canEdit()"
    (click)="edit()"
    title="Rename participant"
    aria-label="Rename participant"
  >
    <dbd-icon name="edit" />
  </button>

  <button
    type="button"
    class="ico-act del"
    [disabled]="!canEdit()"
    (click)="remove()"
    title="Delete participant"
    aria-label="Delete participant"
  >
    <dbd-icon name="delete" />
  </button>
}
