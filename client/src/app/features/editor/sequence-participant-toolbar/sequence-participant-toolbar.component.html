@if (lifeline(); as l) {
  <button
    type="button"
    class="ico-act"
    [ddPopoverTrigger]="colorMenu"
    placement="below-start"
    [disabled]="!canEdit()"
    title="Header color"
    aria-label="Header color"
  >
    <span class="color-dot" [style.background]="css(l.color) || 'var(--dd-handle)'"></span>
  </button>
  <ng-template #colorMenu let-close>
    <div class="color-grid">
      <div class="grid-label">Fill</div>
      <dd-color-swatches [value]="l.color" themeValue="surface" (pick)="setColor($event)" />
      <div class="grid-label">Stroke</div>
      <dd-color-swatches [value]="l.strokeColor" noneLabel="No stroke" themeValue="theme" (pick)="setStroke($event)" />
      <div class="grid-label">Text</div>
      <dd-color-swatches [value]="l.textColor" noneLabel="Automatic" themeValue="theme" (pick)="setText($event)" />
    </div>
  </ng-template>

  <span class="divider"></span>

  <button
    type="button"
    class="ico-act"
    [disabled]="!canEdit()"
    (click)="edit()"
    title="Rename participant"
    aria-label="Rename participant"
  >
    <dd-icon name="edit" />
  </button>

  <button type="button" class="ico-act details" [class.on]="inspector.shown()" (click)="inspector.toggle()" title="Details" aria-label="Details">
    <dd-icon name="tune" />
  </button>
  <button
    type="button"
    class="ico-act del"
    [disabled]="!canEdit()"
    (click)="remove()"
    title="Delete participant"
    aria-label="Delete participant"
  >
    <dd-icon name="delete" />
  </button>
}
