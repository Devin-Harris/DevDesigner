# C5.3: one gate for every push and pull request. `npm run verify` builds the shared
# package, lints (root + client + styles), checks import cycles, runs every workspace's
# tests and does the production build.
name: CI

on:
  push:
    branches: [main, 'audit/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
